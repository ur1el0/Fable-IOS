services:
  fable-backend:
    image: ${FABLE_BACKEND_IMAGE:-fable-backend:local}
    user: "${FABLE_UID:-1000}:${FABLE_GID:-1000}"
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        FABLE_UID: ${FABLE_UID:-1000}
        FABLE_GID: ${FABLE_GID:-1000}
    ports:
      - "${FABLE_BIND_ADDRESS:-127.0.0.1}:${FABLE_PORT:-8001}:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      FABLE_DB_PATH: /app/data/fable.sqlite3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: unless-stopped

  fable-backup:
    image: ${FABLE_BACKEND_IMAGE:-fable-backend:local}
    user: "${FABLE_UID:-1000}:${FABLE_GID:-1000}"
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        FABLE_UID: ${FABLE_UID:-1000}
        FABLE_GID: ${FABLE_GID:-1000}
    profiles: ["backup"]
    depends_on:
      fable-backend:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
      - ${FABLE_BACKUP_HOST_DIR:-./backups}:/app/backups
    environment:
      FABLE_DB_PATH: /app/data/fable.sqlite3
      FABLE_BACKUP_INTERVAL_SECONDS: ${FABLE_BACKUP_INTERVAL_SECONDS:-86400}
      FABLE_BACKUP_RETENTION_DAYS: ${FABLE_BACKUP_RETENTION_DAYS:-30}
      FABLE_BACKUP_HEALTH_MAX_AGE_SECONDS: ${FABLE_BACKUP_HEALTH_MAX_AGE_SECONDS:-93600}
      FABLE_BACKUP_ENCRYPTION_KEY_B64: ${FABLE_BACKUP_ENCRYPTION_KEY_B64:-}
    command: ["python", "/app/scripts/sqlite_backup.py", "schedule", "/app/data/fable.sqlite3", "/app/backups"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "/app/scripts/check_backup_freshness.py", "/app/backups"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 15m
    restart: unless-stopped
