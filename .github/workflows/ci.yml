name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements-test.txt
      - name: Run backend tests
        run: PYTHONPATH=.:backend pytest backend/test_main.py -v

  docker-build-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t fable-backend:test -f backend/Dockerfile .
      - name: Verify test tooling and source are excluded from runtime image
        run: >-
          docker run --rm --entrypoint python fable-backend:test -c
          "import importlib.util; from pathlib import Path; assert importlib.util.find_spec('pytest') is None; assert not Path('/app/test_main.py').exists()"
      - name: Verify backup runner is packaged
        run: docker run --rm --entrypoint python fable-backend:test /app/scripts/sqlite_backup.py --help
      - name: Verify Docker Compose configuration
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose config --quiet

  ios-verification:
    runs-on: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify Release API URL guard
        run: |
          if CONFIGURATION=Release FABLE_API_BASE_URL=http://127.0.0.1:8000/api/v1 scripts/validate_ios_release_config.sh; then
            echo "The Release URL guard accepted an HTTP loopback URL."
            exit 1
          fi
          if CONFIGURATION=Release FABLE_API_BASE_URL=https://127.1/api/v1 scripts/validate_ios_release_config.sh; then
            echo "The Release URL guard accepted an abbreviated loopback address."
            exit 1
          fi
          if CONFIGURATION=Release FABLE_API_BASE_URL= scripts/validate_ios_release_config.sh; then
            echo "The Release URL guard accepted a missing API URL."
            exit 1
          fi
          CONFIGURATION=Release FABLE_API_BASE_URL=https://api.example.com/api/v1 scripts/validate_ios_release_config.sh
      - name: Build and test iOS app
        run: >-
          xcodebuild
          -project frontend/FableApp.xcodeproj
          -scheme FableApp
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          test
      - name: Verify Release build
        run: >-
          xcodebuild
          -project frontend/FableApp.xcodeproj
          -scheme FableApp
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ReleaseDerivedData
          FABLE_API_BASE_URL=https://api.example.com/api/v1
          CODE_SIGNING_ALLOWED=NO
          build
