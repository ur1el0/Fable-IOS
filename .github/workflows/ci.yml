name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-verification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend dependencies
        run: pip install -r backend/requirements-test.txt
      - name: Run backend tests
        run: PYTHONPATH=.:backend pytest backend -v

  docker-build-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build backend image
        run: docker build -t fable-backend:test -f backend/Dockerfile .
      - name: Verify test tooling and source are excluded from runtime image
        run: >-
          docker run --rm --entrypoint python fable-backend:test -c
          "import importlib.util; from pathlib import Path; assert importlib.util.find_spec('pytest') is None; assert not Path('/app/test_main.py').exists()"
      - name: Verify backup runner is packaged
        run: docker run --rm --entrypoint python fable-backend:test /app/scripts/sqlite_backup.py --help
      - name: Verify Docker Compose configuration
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose config --quiet
          docker compose config --format json | python3 -c 'import json, sys; service = json.load(sys.stdin)["services"]["fable-backend"]; assert service["read_only"] is True; assert service["cap_drop"] == ["ALL"]; assert "no-new-privileges:true" in service["security_opt"]; assert service["pids_limit"] == 128; assert any(entry.startswith("/tmp:") and "noexec" in entry and "nosuid" in entry for entry in service["tmpfs"])'

  ios-verification:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 16.4 and verify simulator availability
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          xcodebuild -version
          simulators="$(xcrun simctl list devices available)"
          printf '%s\n' "$simulators"
          if ! printf '%s\n' "$simulators" | awk '
            /^-- iOS 18.5 --$/ { in_runtime = 1; next }
            /^-- / { in_runtime = 0 }
            in_runtime && /iPhone 16 \(/ { found = 1 }
            END { exit !found }
          '; then
            echo "The iPhone 16 / iOS 18.5 simulator is unavailable."
            exit 1
          fi
      - name: Verify Release API URL guard
        run: |
          if CONFIGURATION=Release FABLE_API_BASE_URL=http://127.0.0.1:8000/api/v1 scripts/validate_ios_release_config.sh; then
            echo "The Release URL guard accepted an HTTP loopback URL."
            exit 1
          fi
          if CONFIGURATION=Release FABLE_API_BASE_URL=https://127.1/api/v1 scripts/validate_ios_release_config.sh; then
            echo "The Release URL guard accepted an abbreviated loopback address."
            exit 1
          fi
          if CONFIGURATION=Release FABLE_API_BASE_URL= scripts/validate_ios_release_config.sh; then
            echo "The Release URL guard accepted a missing API URL."
            exit 1
          fi
          CONFIGURATION=Release FABLE_API_BASE_URL=https://api.example.com/api/v1 scripts/validate_ios_release_config.sh
      - name: Build and test iOS app
        run: >-
          xcodebuild
          -project frontend/FableApp.xcodeproj
          -scheme FableApp
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=YES
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=-
          test
      - name: Verify Release build
        run: >-
          xcodebuild
          -project frontend/FableApp.xcodeproj
          -scheme FableApp
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ReleaseDerivedData
          FABLE_API_BASE_URL=https://api.example.com/api/v1
          CODE_SIGNING_ALLOWED=NO
          build
