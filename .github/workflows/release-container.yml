name: Publish backend release image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements-test.txt
      - name: Run backend suite
        run: PYTHONPATH=.:backend pytest backend/test_main.py -v
      - name: Build backend image
        run: docker build -t fable-backend:release-check -f backend/Dockerfile .
      - name: Verify test tooling and source are excluded from runtime image
        run: >-
          docker run --rm --entrypoint python fable-backend:release-check -c
          "import importlib.util; from pathlib import Path; assert importlib.util.find_spec('pytest') is None; assert not Path('/app/test_main.py').exists()"
      - name: Verify backup runner is packaged
        run: docker run --rm --entrypoint python fable-backend:release-check /app/scripts/sqlite_backup.py --help
      - name: Verify Docker Compose configuration
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose config --quiet

  verify-ios:
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 16.4 and verify simulator availability
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          xcodebuild -version
          simulators="$(xcrun simctl list devices available)"
          printf '%s\n' "$simulators"
          if ! printf '%s\n' "$simulators" | awk '
            /^-- iOS 18.5 --$/ { in_runtime = 1; next }
            /^-- / { in_runtime = 0 }
            in_runtime && /iPhone 16 \(/ { found = 1 }
            END { exit !found }
          '; then
            echo "The iPhone 16 / iOS 18.5 simulator is unavailable."
            exit 1
          fi
      - name: Verify Release API URL guard
        run: |
          if CONFIGURATION=Release FABLE_API_BASE_URL=http://127.0.0.1:8000/api/v1 scripts/validate_ios_release_config.sh; then
            echo "The Release URL guard accepted an HTTP loopback URL."
            exit 1
          fi
          if CONFIGURATION=Release FABLE_API_BASE_URL= scripts/validate_ios_release_config.sh; then
            echo "The Release URL guard accepted a missing API URL."
            exit 1
          fi
          CONFIGURATION=Release FABLE_API_BASE_URL=https://api.example.com/api/v1 scripts/validate_ios_release_config.sh
      - name: Build and test iOS app
        run: >-
          xcodebuild
          -project frontend/FableApp.xcodeproj
          -scheme FableApp
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          test
      - name: Verify Release build
        run: >-
          xcodebuild
          -project frontend/FableApp.xcodeproj
          -scheme FableApp
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ReleaseDerivedData
          FABLE_API_BASE_URL=https://api.example.com/api/v1
          CODE_SIGNING_ALLOWED=NO
          build

  publish:
    needs: [verify-backend, verify-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU for ARM64 builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Publish versioned images and report the registry digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx inspect --bootstrap
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file backend/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --tag "${image}:${GITHUB_REF_NAME}" \
            --tag "${image}:${GITHUB_SHA}" \
            --metadata-file /tmp/fable-image-metadata.json \
            --push \
            .
          digest="$(python -c 'import json; print(json.load(open("/tmp/fable-image-metadata.json"))["containerimage.digest"])')"
          printf 'Published image: `%s@%s`\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
